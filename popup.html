<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authnudge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <img src="icons/icon32.png" alt="" width="28" height="28" />
      <div>
        <h1>Authnudge</h1>
        <p id="fingerprint" class="muted">Pairing…</p>
      </div>
    </header>

    <form id="request-form">
      <label for="to">To</label>
      <input
        id="to"
        name="to"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="email or handle"
        maxlength="254"
      />
      <label class="remember" for="remember">
        <input id="remember" name="remember" type="checkbox" />
        Remember this handle
      </label>

      <p class="label">This tab</p>
      <p id="origin" class="origin">Checking…</p>

      <button id="send" type="submit">Request sign-in</button>
    </form>

    <div class="pubkey-block">
      <div class="pubkey-head">
        <p class="label">Public key</p>
        <button id="copy-key" type="button" class="small" aria-label="Copy public key">Copy</button>
      </div>
      <p id="public-key" class="pubkey" title=""></p>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <p id="api-base" class="muted" hidden></p>
    <button id="regenerate" type="button" class="ghost">Regenerate key</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
